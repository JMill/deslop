# Known limitation: this fires even when a citation follows ("research shows X
# (Chen 2024)"). That is intentional — the construction is weak regardless; the
# repair is "Chen (2024) found X". Consumers who disagree can set
# `Deslop.VagueAttribution = NO`.
extends: existence
message: "Vague attribution ('%s'). Name the source and affiliation."
level: warning
ignorecase: true
tokens:
  - 'experts?\s+(?:says?|said|saying|argu(?:e[sd]?|ing)|suggest(?:s|ed|ing)?|believ(?:e[sd]?|ing)|claim(?:s|ed|ing)?)'
  - 'critics\s+(?:says?|said|saying|argu(?:e[sd]?|ing)|claim(?:s|ed|ing)?)'
  - 'sources\s+(?:say|said|saying)'
  - '(?:research|studies|data)\s+(?:show(?:s|ed|ing)?|suggest(?:s|ed|ing)?|indicat(?:e[sd]?|ing))'
  - 'many\s+(?:believ(?:e[sd]?|ing)|argu(?:e[sd]?|ing)|say|said|saying)'
  - 'some\s+(?:believ(?:e[sd]?|ing)|argu(?:e[sd]?|ing)|say|said|saying|would\s+say)'
  - 'it\s+is\s+widely\s+believed'
  - 'it\s+is\s+often\s+said'

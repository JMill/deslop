extends: existence
message: "Corporate metaphor. Say the literal thing."
level: warning
ignorecase: true
tokens:
  - 'north\s+star'
  - 'boil\s+the\s+ocean'
  - 'low[-\s]hanging\s+fruit'
  - 'circle\s+back'
  - 'touch\s+base'
  - 'double[-\s]click(?:ing|ed)?\s+(?:on|into)'
  - 'move\s+the\s+goalposts'
  - 'peel(?:ing)?\s+(?:back\s+)?the\s+onion'
  - 'run\s+(?:it|this)\s+up\s+the\s+flagpole'
  - 'take\s+(?:it|this)\s+offline'
  - 'drink(?:ing)?\s+from\s+the\s+fire\s?hose'

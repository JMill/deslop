StylesPath = styles
MinAlertLevel = suggestion

Vocab = Deslop

# Deslop only. We deliberately do not enable the built-in `Vale` base style:
# it ships Vale.Spelling (flags normal dev terms like "repo") and Vale.Avoid
# (which double-flags words our own rules already cover). Add `Vale` back
# yourself if you also want spell-checking.
[*.{md,mdx}]
BasedOnStyles = Deslop

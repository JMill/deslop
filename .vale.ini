# Config used to lint THIS repo's own prose. Consumers use a different .vale.ini
# (see README): they set `Packages = <release url>` and run `vale sync`.
StylesPath = styles
MinAlertLevel = suggestion

# Deslop only. We deliberately do not enable the built-in `Vale` base style:
# it ships Vale.Spelling (flags normal dev terms like "repo") and Vale.Avoid
# (which double-flags words our own rules already cover).
[*.{md,mdx}]
BasedOnStyles = Deslop

# tests/ holds deliberate slop. It is linted by tests/run.sh against its own
# config, not by this one — otherwise `vale .` reports ~190 intended alerts.
[tests/*.md]
BasedOnStyles =

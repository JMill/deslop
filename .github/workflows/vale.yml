name: Vale

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  vale:
    name: deslop lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: '**/*.md'
          reporter: github-pr-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Vale

on:
  pull_request:
    paths:
      - '**/*.md'

# github-pr-check needs to write a check run; reviewdog reads the PR to place
# annotations. Declared explicitly so the workflow does not depend on the
# repository's default token permissions.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  vale:
    name: deslop lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare styles dir
        run: mkdir -p styles

      - name: Run Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          files: '**/*.md'
          reporter: github-pr-check
          # Both of these default to values that make the check advisory only:
          # fail_on_error defaults to false (findings never block a merge) and
          # filter_mode defaults to `added` (only newly added lines are read).
          # This repo is clean, so it holds itself to the strict setting.
          fail_on_error: true
          filter_mode: nofilter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
